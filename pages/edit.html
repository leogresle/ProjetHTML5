<!-- edit.html -->
<section id="welcome-hero">
    <div class="container">
        <div class="row">
            <div class="col-md-12 text-center">
                <div class="header-text">
                    <h2>Édition</h2>
                    <p>Modifiez les informations du calendrier ci-dessous.</p>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="about">
    <div class="section-heading text-center">
        <h2>Modifier les informations du calendrier</h2>
    </div>
    <div class="container">
        <div class="about-content">
            <div class="row">
                <div class="col-sm-6">
                    <form id="edit-form">
                        <div class="form-group">
                            <label for="calendar-name">Nom du calendrier :</label>
                            <input type="text" id="calendar-name" class="form-control" placeholder="Entrez le nom du calendrier" required>
                        </div>
                        <div class="form-group">
                            <label for="calendar-description">Description :</label>
                            <textarea id="calendar-description" class="form-control" rows="4" placeholder="Entrez une description" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="calendar-date">Date de l'événement :</label>
                            <input type="date" id="calendar-date" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Sauvegarder les modifications</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="contact">
    <div class="section-heading text-center">
        <h2>Contactez-nous</h2>
        <p>Si vous avez des questions concernant l'édition de ce calendrier, contactez-nous.</p>
    </div>
    <div class="container">
        <div class="contact-content">
            <div class="row">
                <div class="col-md-12">
                    <div class="single-contact-box">
                        <p>Email : contact@calendrier.com</p>
                        <p>Téléphone : +123 456 7890</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
