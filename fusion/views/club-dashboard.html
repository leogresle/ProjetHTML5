<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Club</title>
</head>
<body>
  <h1>Bienvenue sur votre espace Club : <span id="club-name"></span></h1>
  <br>
  <h2>Espace Club</h2>

  <nav>
    <ul>
      <li><a href="/calendar.html">📅 Voir le calendrier</a></li>
      <li><a href="/clubs.html">📋 Voir les autres clubs</a></li>
      <li><a href="/Edit.html">Ajouter ou modifier un évènement</a></li>
    </ul>
  </nav>

  <br>

  <form action="/logout" method="GET">
    <button type="submit">Se déconnecter</button>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/api/club/me');
        if (!response.ok) throw new Error('Erreur lors de la récupération des infos du club');
  
        const data = await response.json();
        document.getElementById('club-name').innerText = data.name;
      } catch (error) {
        console.error(error);
        document.getElementById('club-name').innerText = 'Club';
      }
    });
  </script>
  
</body>
</html>
