<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un club</title>
  <link rel="stylesheet" href="/public/css/club_add.css">
  <link rel="shortcut icon" type="image/icon" href="assets/logo/p_transparent.png"/>
</head>
<body>
  <h1>Ajouter un nouveau club</h1>
  <br>
  <div class="container">
    <form action="/ajouter-club" method="POST">
      <label for="name">Nom du club :</label>
      <input type="text" name="name" id="name" required>
      <br><br>

      <label for="email">Email du club :</label>
      <input type="email" name="email" id="email" required>
      <br><br>

      <button class="btn" type="submit">Ajouter le club</button>
    </form>
  </div>
</body>
</html>
