<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Club</title>
    <script src="authGuard.js"></script>
</head>
<body>
    <h2>Bienvenue sur votre espace club</h2>
    <p>Vous pouvez gérer vos événements ici.</p>
    <button id="logout-button">Se déconnecter</button>
</body>
<script>
    document.getElementById("logout-button").addEventListener("click", function() {
        localStorage.clear();  // Supprime le token et le rôle
        window.location.href = "connexion.html";  // Redirection vers la page de connexion
    });
</script>

</html>
