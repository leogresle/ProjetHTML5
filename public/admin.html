<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin</title>
    <script src="invitation.js"></script> <!-- Lien vers ton script invitation.js -->
</head>
<body>
    <h2>Espace Administrateur (BDE)</h2>
    <p>Envoyer une invitation aux clubs :</p>

    <form id="invite-form">
        <input type="email" id="club-email" placeholder="Email du club" required>
        <button type="submit">Envoyer Invitation</button>
    </form>

    <button id="logout-button">Se déconnecter</button>

    <p id="message"></p> <!-- Message d'état pour l'admin -->

</body>
</html>
