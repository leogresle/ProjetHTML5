<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier | Polytech Angers</title>
    <style>
        #success-message {
            color: green;
            font-weight: bold;
        }
        #error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Connexion</h2>

    <!-- Message d'erreur ou de succès -->
    <p id="error-message"></p>
    <p id="success-message"></p>

    <!-- Formulaire de connexion -->
    <form id="login-form">
        <label for="login-email">Email :</label>
        <input type="email" id="login-email" name="email" required><br><br>
        
        <label for="login-password">Mot de passe :</label>
        <input type="password" id="login-password" name="password" required><br><br>
        
        <button type="submit">Se connecter</button>
    </form>

    <p>Vous n'avez pas de compte ? <a href="inscription.html">Inscription</a></p>

    <script src="connexion.js"></script>
</body>
</html>
