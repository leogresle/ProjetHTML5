<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Définir le mot de passe</title>
</head>
<body>
  <h1>Définissez votre mot de passe</h1>
  <form action="/set-password/{{userId}}" method="POST">
    <label for="password">Nouveau mot de passe :</label>
    <input type="password" name="password" required>
    <button type="submit">Définir le mot de passe</button>
  </form>
</body>
</html>
