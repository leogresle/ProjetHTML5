<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des Événements - Polytech</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Calendrier des Événements - Polytech</h1>
        <button id="login-btn">Se connecter</button>
    </header>

    <section id="calendar">
        <input type="text" id="search-input" placeholder="Rechercher un événement...">
        <div id="events-container">
            <!-- Les événements s'affichent ici -->
        </div>
    </section>

    <section id="registration">
        <h2>Inscription</h2>
        
        <!-- Message d'erreur ou de succès -->
        <p id="error-message" style="color: red;"></p>
        <p id="success-message" style="color: green;"></p>

        <!-- Formulaire d'inscription -->
        <form id="signup-form">
            <label for="username">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username" required><br><br>
            
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required><br><br>
            
            <button type="submit">S'inscrire</button>
        </form>

        <p>Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </section>

    <script src="scripts.js"></script>
</body>
</html>
