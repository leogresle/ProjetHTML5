<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->

  <title>Calendrier d'Événements</title>
  
  <!-- Import du fichier CSS externe -->
  <link rel="stylesheet" href="/public/css/calendar.css">

  <!--bootstrap.min.css-->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">	

  <link rel="stylesheet" href="assets/css/flaticon.css">


  <!--animate.css-->
  <link rel="stylesheet" href="assets/css/animate.css">

  
  <!--owl.carousel.css-->
  <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
  <link rel="stylesheet" href="assets/css/owl.theme.default.min.css">
  
  <!--bootstrap.min.css-->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">

  
	<!--font-awesome.min.css-->
	<link rel="stylesheet" href="assets/css/font-awesome.min.css">


  <!-- bootsnav -->
  <link rel="stylesheet" href="assets/css/bootsnav.css" >	

  <!--style.css-->
  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
  <header class="top-area">
    <div class="header-area">
        <!-- Start Navigation -->
        <nav class="navbar navbar-default bootsnav navbar-fixed dark no-background">

            <div class="container">

                <!-- Start Header Navigation -->
                <div class="navbar-header">
            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#navbar-menu">
                <i class="fa fa-bars"></i>
            </button>
            <a class="navbar-brand" href="?a=connexion">CONNEXION</a>
        </div><!--/.navbar-header-->

                <!-- End Header Navigation -->

                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse menu-ui-design" id="navbar-menu">
                    <ul class="nav navbar-nav navbar-right" data-in="fadeInDown" data-out="fadeOutUp">
                        <li class=" smooth-menu active"></li>
                        <li class="smooth-menu"><a href="?a=acceuil" id="acceuil-link">Accueil</a></li>
            <li class="smooth-menu"><a href="?a=calendrier" id="calendrier-link">Calendrier</a></li>
            <li class="smooth-menu"><a href="?a=edit" id="edit-link">Edit</a></li>
            <li class="smooth-menu"><a href="?a=clubs">Clubs</a></li>
            <li class="smooth-menu"><a href="?a=news">News</a></li>
                    </ul><!--/.nav -->
                </div><!-- /.navbar-collapse -->
            </div><!--/.container-->
        </nav><!--/nav-->
        <!-- End Navigation -->
    </div><!--/.header-area-->
  </header><!-- /.top-area-->

  <div style="height: 100px;"></div>

  <div class="containerM">
    <!-- Filtre par Club -->
    <div id="club-filter">
      <h3>Filtrer par Club</h3>
      <div id="filter-options">
        <!-- Les options de filtre seront générées ici -->
      </div>
    </div>
    <!-- Conteneur du calendrier -->
    <div id="calendar-containerM">
      <!-- En-tête du calendrier -->
      <div id="calendar-header">
        <button id="prev-month">Mois Précédent</button>
        <h2 id="month-year">Mois et Année</h2>
        <button id="next-month">Mois Suivant</button>
      </div>
      <!-- Conteneur du calendrier -->
      <div id="calendar">
        <!-- Les en-têtes et jours seront générés par JS -->
      </div>
      <!-- Modal Structure -->
      <div id="eventModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2 id="eventTitle"></h2>
          <p><strong>Club:</strong> <span id="eventClub"></span></p>
          <p><strong>Date:</strong> <span id="eventDate"></span></p>
          <p><strong>Heure:</strong> <span id="eventTime"></span></p>
          <p><strong>Lieu:</strong> <span id="eventLocation"></span></p>
          <p><strong>Description:</strong> <span id="eventDescription"></span></p>
          <button id="addToGoogleCalendar">Ajouter à Google Agenda</button>
          <div class="like-containerM">
            <button id="likeButton" class="like-button">Like</button>
          </div>
        </div>
      </div>
      <!-- Import du fichier JS externe -->
      <script src="calendrier.js"></script>
    </div>
  </div>
</body>
</html>
