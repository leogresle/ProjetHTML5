<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Clubs</title>
    
    <style>
        /* Style pour le cercle de couleur */
        .color-circle {
            width: 20px;         /* Largeur du cercle */
            height: 20px;        /* Hauteur du cercle */
            border-radius: 50%;  /* Forme ronde */
            display: inline-block;
            margin-right: 10px;  /* Espacement entre le cercle et le texte */
        }
    </style>
</head>
<body>

<h1>Liste des Clubs</h1>

<div id="clubs-list">
    <!-- La liste des clubs sera affichée ici -->
</div>

<script>
// Fonction pour récupérer la liste des clubs
function fetchClubs() {
    fetch('/api/clubs')
        .then(response => response.json())  // Récupérer la réponse sous forme de JSON
        .then(data => {
            console.log(data); // Afficher les données dans la console pour déboguer
            displayClubs(data);  // Appeler la fonction pour afficher les clubs
        })
        .catch(error => {
            console.error('Erreur:', error);
        });
}

// Fonction pour afficher la liste des clubs
function displayClubs(clubs) {
    const clubsListDiv = document.getElementById('clubs-list');

    // Vérifier si la liste des clubs est vide
    if (clubs.length === 0) {
        clubsListDiv.innerHTML = '<p>Aucun club trouvé.</p>';
        return;
    }

    // Créer une liste d'éléments pour chaque club
    const ul = document.createElement('ul');
    clubs.forEach(club => {
        const li = document.createElement('li');
        li.style.border = '1px solid #ccc';
        li.style.padding = '10px';
        li.style.marginBottom = '10px';

        // Créer un élément span pour afficher la couleur sous forme de cercle
        const colorCircle = document.createElement('span');
        colorCircle.classList.add('color-circle');
        colorCircle.style.backgroundColor = club.color;  // Appliquer la couleur du club au cercle

        li.innerHTML = `
            <strong>${club.name}</strong><br>
            <span>${club.description}</span><br>
            <div style="display: flex; align-items: center;">
                ${colorCircle.outerHTML}
                <span style="color:${club.color}">${club.color}</span>
            </div>
        `;

        ul.appendChild(li);
    });

    clubsListDiv.appendChild(ul);
}

// Appel de la fonction pour récupérer et afficher les clubs
fetchClubs();
</script>

</body>
</html>
