<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Clubs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Liste des Clubs</h1>

<div id="clubs-list">
    <!-- La liste des clubs sera affichée ici -->
</div>

<a href="/user-dashboard.html">Retour au dashboard</a>

<script>
// Fonction pour récupérer la liste des clubs
function fetchClubs() {
    fetch('/api/clubs')
        .then(response => response.json())  // Récupérer la réponse sous forme de JSON
        .then(data => {
            console.log(data); // Afficher les données dans la console pour déboguer
            displayClubs(data);  // Appeler la fonction pour afficher les clubs
        })
        .catch(error => {
            console.error('Erreur:', error);
        });
}

// Fonction pour afficher la liste des clubs
function displayClubs(clubs) {
    const clubsListDiv = document.getElementById('clubs-list');

    // Vérifier si la liste des clubs est vide
    if (clubs.length === 0) {
        clubsListDiv.innerHTML = '<p>Aucun club trouvé.</p>';
        return;
    }

    // Créer une liste d'éléments pour chaque club
    clubs.forEach(club => {
        const clubDiv = document.createElement('div');
        clubDiv.classList.add('club-item');

        // Section pour le nom du club
        const nameSection = document.createElement('div');
        nameSection.classList.add('club-name');
        nameSection.innerHTML = `<strong>${club.name}</strong>`;

        // Section pour la description du club
        const descriptionSection = document.createElement('div');
        descriptionSection.classList.add('club-description');
        descriptionSection.innerHTML = `<span>${club.description}</span>`;

        // Section pour la couleur du club
        const colorSection = document.createElement('div');
        colorSection.classList.add('club-color');
        const colorCircle = document.createElement('span');
        colorCircle.classList.add('color-circle');
        colorCircle.style.backgroundColor = club.color;  // Appliquer la couleur du club au cercle
        colorSection.innerHTML = `
            <div class="color-display">
                ${colorCircle.outerHTML}
                <span class="color-text" style="color:${club.color}">${club.color}</span>
            </div>
        `;

        // Ajouter les sections au clubDiv
        clubDiv.appendChild(nameSection);
        clubDiv.appendChild(descriptionSection);
        clubDiv.appendChild(colorSection);

        clubsListDiv.appendChild(clubDiv);
    });
}

// Appel de la fonction pour récupérer et afficher les clubs
fetchClubs();
</script>
</body>
</html>
